      - name: dev-loot-claims
        if: matrix.group == 'gameplay'
        run: node scripts/recovery-step.mjs dev-loot-claims 300 node scripts/loot-claims-browser-audit.mjs
      - name: dev-undo-toasts
        if: matrix.group == 'gameplay'
        run: node scripts/recovery-step.mjs dev-undo-toasts 240 node scripts/undo-toasts-browser-audit.mjs
      - name: dev-loot-fairness
