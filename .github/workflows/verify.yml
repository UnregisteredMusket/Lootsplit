name: Verify preserved functionality
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  # PRs verify feature work once; main always verifies the merged release independently.
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Code checks and immutable builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      website_artifact: ${{ steps.website.outputs.artifact-id }}
      standby_artifact: ${{ steps.standby.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: unit-tests
        run: node scripts/recovery-step.mjs unit-tests 240 npm test
      - name: typecheck
        run: node scripts/recovery-step.mjs typecheck 120 npm run typecheck
      - name: lint
        run: node scripts/recovery-step.mjs lint 120 npm run lint
      - name: web-build
        run: node scripts/recovery-step.mjs web-build 240 npm run build:cloudflare
      - run: node scripts/release-artifact.mjs prepare
      - run: node scripts/standby-artifact.mjs prepare
      - name: mobile-build
        run: node scripts/recovery-step.mjs mobile-build 180 npm run build:mobile
      - run: node scripts/standby-artifact.mjs verify
      - name: Confirm audited bytes are unchanged
        run: node scripts/release-artifact.mjs verify
      - uses: actions/upload-artifact@v4
        id: website
        with:
          name: website-release-${{ github.sha }}
          path: dist/website-release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          # A deliberate build-job rerun replaces the candidate and reruns its dependants.
          overwrite: true
      - uses: actions/upload-artifact@v4
        id: standby
        with:
          name: standby-release-${{ github.sha }}
          path: dist/standby-release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          # A deliberate build-job rerun replaces the candidate and reruns its dependants.
          overwrite: true
      - name: Summarize measured verification stages
        if: always()
        run: node scripts/verification-timing.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-audit-build-${{ github.run_attempt }}
          path: test-results/
          retention-days: 30

  development:
    name: Development / ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Preserve independent results when another group fails; allow targeted reruns.
      fail-fast: false
      max-parallel: 4
      matrix:
        group: [governance, accounts, gameplay, desktop]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start disposable development server
        timeout-minutes: 3
        run: |
          mkdir -p test-results
          npm run dev > test-results/dev-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --max-time 2 -fsS http://127.0.0.1:8080/ > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "Development server did not become ready" >&2
          exit 1
      - name: dev-campaign-governance
        if: matrix.group == 'governance'
        run: node scripts/recovery-step.mjs dev-campaign-governance 240 node scripts/campaign-governance-browser-audit.mjs
      - name: dev-theme
        if: matrix.group == 'governance'
        run: node scripts/recovery-step.mjs dev-theme 240 node scripts/theme-browser-audit.mjs
      - name: dev-sound
        if: matrix.group == 'governance'
        run: node scripts/recovery-step.mjs dev-sound 180 node scripts/sound-browser-audit.mjs
      - name: dev-help
        if: matrix.group == 'governance'
        run: node scripts/recovery-step.mjs dev-help 240 node scripts/help-browser-audit.mjs
      - name: dev-release
        if: matrix.group == 'governance'
        run: node scripts/recovery-step.mjs dev-release 240 node scripts/release-browser-audit.mjs
      - name: dev-backup
        if: matrix.group == 'governance'
        env:
          AUDIT_ORIGIN: http://127.0.0.1:8080
        run: node scripts/recovery-step.mjs dev-backup 240 node scripts/backup-browser-audit.mjs
      - name: dev-account
        if: matrix.group == 'accounts'
        run: node scripts/recovery-step.mjs dev-account 240 node scripts/account-browser-audit.mjs
      - name: dev-owner
        if: matrix.group == 'accounts'
        env:
          AUDIT_ORIGIN: http://127.0.0.1:8080
        run: node scripts/recovery-step.mjs dev-owner 240 node scripts/owner-browser-audit.mjs
      - name: dev-member
        if: matrix.group == 'accounts'
        run: node scripts/recovery-step.mjs dev-member 240 node scripts/member-browser-audit.mjs
      - name: dev-monitor
        if: matrix.group == 'accounts'
        run: node scripts/recovery-step.mjs dev-monitor 240 node scripts/monitor-browser-audit.mjs
      - name: dev-bug
        if: matrix.group == 'accounts'
        run: node scripts/recovery-step.mjs dev-bug 240 node scripts/bug-browser-audit.mjs
      - name: dev-character
        if: matrix.group == 'accounts'
        run: node scripts/recovery-step.mjs dev-character 240 node scripts/character-browser-audit.mjs
      - name: dev-party-sheet
        if: matrix.group == 'accounts'
        run: node scripts/recovery-step.mjs dev-party-sheet 240 node scripts/party-sheet-browser-audit.mjs
      - name: dev-bug-edge-cases
        if: matrix.group == 'gameplay'
        run: node scripts/recovery-step.mjs dev-bug-edge-cases 240 node scripts/bug-audit-edge-cases.mjs
      - name: dev-bug-data-integrity
        if: matrix.group == 'gameplay'
        run: node scripts/recovery-step.mjs dev-bug-data-integrity 240 node scripts/bug-audit-data-integrity.mjs
      - name: dev-bug-permission-transfers
        if: matrix.group == 'gameplay'
        run: node scripts/recovery-step.mjs dev-bug-permission-transfers 240 node --experimental-strip-types scripts/bug-audit-permission-transfers.mjs
      - name: dev-encounter
        if: matrix.group == 'gameplay'
        run: node scripts/recovery-step.mjs dev-encounter 240 node scripts/encounter-browser-audit.mjs
      - name: dev-local-encounter
        if: matrix.group == 'gameplay'
        run: node scripts/recovery-step.mjs dev-local-encounter 240 node scripts/local-encounter-browser-audit.mjs
      - name: dev-finance
        if: matrix.group == 'gameplay'
        run: node scripts/recovery-step.mjs dev-finance 240 node scripts/finance-browser-audit.mjs
      - name: dev-shop-stock
        if: matrix.group == 'gameplay'
        run: node scripts/recovery-step.mjs dev-shop-stock 240 node scripts/shop-stock-browser-audit.mjs
      - name: dev-market-locations
        if: matrix.group == 'gameplay'
        run: node scripts/recovery-step.mjs dev-market-locations 240 node scripts/market-locations-browser-audit.mjs
      - name: dev-properties
        if: matrix.group == 'gameplay'
        run: node scripts/recovery-step.mjs dev-properties 240 node scripts/property-browser-audit.mjs
      - name: dev-property-operations
        if: matrix.group == 'gameplay'
        run: node scripts/recovery-step.mjs dev-property-operations 240 node scripts/property-operations-browser-audit.mjs
      - name: dev-world-features
        if: matrix.group == 'gameplay'
        run: node scripts/recovery-step.mjs dev-world-features 240 node scripts/world-features-browser-audit.mjs
      - name: dev-control-panel
        if: matrix.group == 'gameplay'
        run: node scripts/recovery-step.mjs dev-control-panel 240 node scripts/control-panel-browser-audit.mjs
      - name: dev-library-navigation
        if: matrix.group == 'gameplay'
        run: node scripts/recovery-step.mjs dev-library-navigation 240 node scripts/library-navigation-browser-audit.mjs
      - name: dev-loot
        if: matrix.group == 'gameplay'
        run: node scripts/recovery-step.mjs dev-loot 240 node scripts/loot-browser-audit.mjs
      - name: dev-desktop
        if: matrix.group == 'desktop'
        run: node scripts/recovery-step.mjs dev-desktop 240 node scripts/desktop-browser-audit.mjs
      - name: dev-game-analytics
        if: matrix.group == 'desktop'
        run: node scripts/recovery-step.mjs dev-game-analytics 240 node scripts/game-analytics-browser-audit.mjs
      - name: dev-website
        if: matrix.group == 'desktop'
        run: node scripts/recovery-step.mjs dev-website 240 node scripts/website-browser-audit.mjs
      - name: Summarize measured verification stages
        if: always()
        run: node scripts/verification-timing.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-audit-dev-${{ matrix.group }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 30

  worker:
    name: Packaged Worker / ${{ matrix.group }}
    needs: build
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        group: [accounts, interface]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.website_artifact }}
          path: dist/website-release
          merge-multiple: true
      - run: node scripts/release-artifact.mjs verify
      - name: Start disposable built Worker
        timeout-minutes: 3
        run: |
          mkdir -p test-results
          npx wrangler d1 migrations apply DB --local
          npx wrangler dev --config dist/website-release/wrangler.toml --no-bundle --persist-to .wrangler/state --local --port 8082 --var ACCOUNT_ORIGIN:http://127.0.0.1:8082 --var ACCOUNT_SECRET:disposable-ci-only-account-secret-123456789 > test-results/worker-server.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl --max-time 2 -fsS http://127.0.0.1:8082/welcome > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "Built Worker did not become ready" >&2
          exit 1
      - name: worker-account
        if: matrix.group == 'accounts'
        env:
          ACCOUNT_AUDIT_ORIGIN: http://127.0.0.1:8082
        run: node scripts/recovery-step.mjs worker-account 180 node scripts/account-browser-audit.mjs
      - name: worker-monitor
        if: matrix.group == 'accounts'
        run: node scripts/recovery-step.mjs worker-monitor 180 node scripts/monitor-worker-audit.mjs
      - name: worker-finance
        if: matrix.group == 'accounts'
        env:
          AUDIT_ORIGIN: http://127.0.0.1:8082
        run: node scripts/recovery-step.mjs worker-finance 180 node scripts/finance-browser-audit.mjs
      - name: worker-theme
        if: matrix.group == 'interface'
        env:
          AUDIT_ORIGIN: http://127.0.0.1:8082
        run: node scripts/recovery-step.mjs worker-theme 180 node scripts/theme-browser-audit.mjs
      - name: worker-shop-stock
        if: matrix.group == 'interface'
        env:
          AUDIT_ORIGIN: http://127.0.0.1:8082
        run: node scripts/recovery-step.mjs worker-shop-stock 180 node scripts/shop-stock-browser-audit.mjs
      - name: worker-market-locations
        if: matrix.group == 'interface'
        env:
          AUDIT_ORIGIN: http://127.0.0.1:8082
        run: node scripts/recovery-step.mjs worker-market-locations 180 node scripts/market-locations-browser-audit.mjs
      - name: worker-properties
        if: matrix.group == 'interface'
        env:
          AUDIT_ORIGIN: http://127.0.0.1:8082
        run: node scripts/recovery-step.mjs worker-properties 180 node scripts/property-browser-audit.mjs
      - name: worker-property-operations
        if: matrix.group == 'interface'
        env:
          AUDIT_ORIGIN: http://127.0.0.1:8082
        run: node scripts/recovery-step.mjs worker-property-operations 180 node scripts/property-operations-browser-audit.mjs
      - name: worker-world-features
        if: matrix.group == 'interface'
        env:
          AUDIT_ORIGIN: http://127.0.0.1:8082
        run: node scripts/recovery-step.mjs worker-world-features 240 node scripts/world-features-browser-audit.mjs
      - name: worker-sound
        if: matrix.group == 'interface'
        env:
          AUDIT_ORIGIN: http://127.0.0.1:8082
        run: node scripts/recovery-step.mjs worker-sound 180 node scripts/sound-browser-audit.mjs
      - name: worker-help
        if: matrix.group == 'interface'
        env:
          AUDIT_ORIGIN: http://127.0.0.1:8082
        run: node scripts/recovery-step.mjs worker-help 180 node scripts/help-browser-audit.mjs
      - name: worker-game-analytics
        if: matrix.group == 'interface'
        env:
          AUDIT_ORIGIN: http://127.0.0.1:8082
        run: node scripts/recovery-step.mjs worker-game-analytics 180 node scripts/game-analytics-browser-audit.mjs
      - name: worker-website
        if: matrix.group == 'interface'
        env:
          AUDIT_ORIGIN: http://127.0.0.1:8082
        run: node scripts/recovery-step.mjs worker-website 180 node scripts/website-browser-audit.mjs
      - name: worker-library-navigation
        if: matrix.group == 'interface'
        env:
          AUDIT_ORIGIN: http://127.0.0.1:8082
        run: node scripts/recovery-step.mjs worker-library-navigation 180 node scripts/library-navigation-browser-audit.mjs
      - name: worker-loot
        if: matrix.group == 'interface'
        env:
          AUDIT_ORIGIN: http://127.0.0.1:8082
        run: node scripts/recovery-step.mjs worker-loot 180 node scripts/loot-browser-audit.mjs
      - name: Verify title screen on the built artifact
        if: matrix.group == 'interface'
        env:
          AUDIT_ORIGIN: http://127.0.0.1:8082
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
        run: node scripts/recovery-step.mjs built-live-check 240 node scripts/live-release-audit.mjs
      - name: Confirm audited bytes are unchanged
        run: node scripts/release-artifact.mjs verify
      - name: Summarize measured verification stages
        if: always()
        run: node scripts/verification-timing.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-audit-worker-${{ matrix.group }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 30

  standby:
    name: Packaged standby
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.standby_artifact }}
          path: dist/standby-release
          merge-multiple: true
      - run: node scripts/standby-artifact.mjs verify
      - name: standby-audit
        run: node scripts/recovery-step.mjs standby-audit 300 node scripts/standby-artifact-audit.mjs
      - run: node scripts/standby-artifact.mjs verify
      - name: Summarize measured verification stages
        if: always()
        run: node scripts/verification-timing.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-audit-standby-${{ github.run_attempt }}
          path: test-results/
          retention-days: 30

  verify:
    name: verify
    if: always()
    needs: [build, development, worker, standby]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Require every preservation group to pass
        env:
          VERIFICATION_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/verification-gate.mjs
