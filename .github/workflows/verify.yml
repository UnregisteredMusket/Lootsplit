name: Verify preserved functionality
on:
  workflow_call:
  pull_request:
  push:
    branches: [main, 'improvement/**']
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build:cloudflare
      - run: node scripts/release-artifact.mjs prepare
      - run: node scripts/standby-artifact.mjs prepare
      - run: npm run build:mobile
      - run: npx playwright install --with-deps chromium
      - run: node scripts/standby-artifact-audit.mjs
      - name: Browser recovery and UI checks
        timeout-minutes: 9
        run: |
          npm run dev > /tmp/lootsplit-dev.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/ > /dev/null; then break; fi
            sleep 2
          done
          node scripts/release-browser-audit.mjs
          AUDIT_ORIGIN=http://127.0.0.1:8080 node scripts/backup-browser-audit.mjs
          node scripts/account-browser-audit.mjs
          AUDIT_ORIGIN=http://127.0.0.1:8080 node scripts/owner-browser-audit.mjs
          node scripts/member-browser-audit.mjs
          node scripts/monitor-browser-audit.mjs
          node scripts/bug-browser-audit.mjs
          node scripts/character-browser-audit.mjs
          node scripts/party-sheet-browser-audit.mjs
          node scripts/bug-audit-edge-cases.mjs
          node scripts/bug-audit-data-integrity.mjs
          node --experimental-strip-types scripts/bug-audit-permission-transfers.mjs
          node scripts/encounter-browser-audit.mjs
          node scripts/local-encounter-browser-audit.mjs
          node scripts/finance-browser-audit.mjs
          node scripts/control-panel-browser-audit.mjs
          node scripts/library-navigation-browser-audit.mjs
          node scripts/desktop-browser-audit.mjs
          node scripts/game-analytics-browser-audit.mjs
          node scripts/website-browser-audit.mjs
      - name: Built Worker account checks
        timeout-minutes: 4
        run: |
          npx wrangler d1 migrations apply DB --local
          npx wrangler dev --config dist/website-release/wrangler.toml --no-bundle --persist-to .wrangler/state --local --port 8082 --var ACCOUNT_ORIGIN:http://127.0.0.1:8082 --var ACCOUNT_SECRET:disposable-ci-only-account-secret-123456789 > /tmp/lootsplit-worker.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8082/welcome > /dev/null; then break; fi
            sleep 2
          done
          ACCOUNT_AUDIT_ORIGIN=http://127.0.0.1:8082 node scripts/account-browser-audit.mjs
          node scripts/monitor-worker-audit.mjs
          AUDIT_ORIGIN=http://127.0.0.1:8082 node scripts/finance-browser-audit.mjs
          AUDIT_ORIGIN=http://127.0.0.1:8082 node scripts/game-analytics-browser-audit.mjs
          AUDIT_ORIGIN=http://127.0.0.1:8082 node scripts/website-browser-audit.mjs
      - name: Verify title screen on the built artifact
        env:
          AUDIT_ORIGIN: http://127.0.0.1:8082
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
        run: node scripts/live-release-audit.mjs
      - name: Confirm audited bytes are unchanged
        run: node scripts/release-artifact.mjs verify
      - run: node scripts/standby-artifact.mjs verify
      - uses: actions/upload-artifact@v4
        with:
          name: standby-release-${{ github.sha }}
          path: dist/standby-release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: website-release-${{ github.sha }}
          path: dist/website-release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-audit
          path: test-results/
