        run: node scripts/recovery-step.mjs worker-account-1 180 node scripts/account-browser-audit.mjs
      - name: worker-monitor
        if: matrix.group == 'accounts'
        run: node scripts/recovery-step.mjs worker-monitor 180 node scripts/monitor-worker-audit.mjs
      - name: worker-finance
        if: matrix.group == 'accounts'
        env:
          AUDIT_ORIGIN: http://127.0.0.1:8082
        run: node scripts/recovery-step.mjs worker-finance 180 node scripts/finance-browser-audit.mjs
      - name: worker-ships
        if: matrix.group == 'accounts'
        env:
          AUDIT_ORIGIN: http://127.0.0.1:8082
        run: node scripts/recovery-step.mjs worker-ships 240 node scripts/ships-browser-audit.mjs
      - name: worker-theme
        if: matrix.group == 'accounts'
        env:
          AUDIT_ORIGIN: http://127.0.0.1:8082
        run: node scripts/recovery-step.mjs worker-theme 180 node scripts/theme-browser-audit.mjs
      - name: worker-account-2
        if: matrix.group == 'features'
        env:
          ACCOUNT_AUDIT_ORIGIN: http://127.0.0.1:8082
          ACCOUNT_SHARD: 2/2
        run: node scripts/recovery-step.mjs worker-account-2 180 node scripts/account-browser-audit.mjs
      - name: worker-map-tiles
        if: matrix.group == 'features'
        env:
          AUDIT_ORIGIN: http://127.0.0.1:8082
        run: node scripts/recovery-step.mjs worker-map-tiles 240 node scripts/map-tiles-browser-audit.mjs
      - name: worker-website
