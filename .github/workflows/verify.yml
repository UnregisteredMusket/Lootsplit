        if: always()
        with:
          name: browser-audit-dev-${{ matrix.group }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 30

  worker:
    name: Packaged Worker / ${{ matrix.group }}
    needs: build
    # Packaged-artifact audits gate every main release; pull requests rely on development audits.
    # Six groups balanced by measured median audit time keep this off the main critical path.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        group: [accounts, features, world, economy, library, interface]
    # Job timeouts are the earlier test budget plus the browser install step's own 12-minute bound,
    # so a slow runner install cannot consume the time the audits need.
    runs-on: ubuntu-latest
    timeout-minutes: 27
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        timeout-minutes: 12
        uses: ./.github/actions/playwright-chromium
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.website_artifact }}
          path: dist/website-release
          merge-multiple: true
      - run: node scripts/release-artifact.mjs verify
      - name: Start disposable built Worker
        timeout-minutes: 3
        run: |
          mkdir -p test-results
          npx wrangler d1 migrations apply DB --local
          npx wrangler dev --config dist/website-release/wrangler.toml --no-bundle --persist-to .wrangler/state --local --port 8082 --var ACCOUNT_ORIGIN:http://127.0.0.1:8082 --var ACCOUNT_SECRET:disposable-ci-only-account-secret-123456789 > test-results/worker-server.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl --max-time 2 -fsS http://127.0.0.1:8082/welcome > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "Built Worker did not become ready" >&2
          exit 1
      - name: worker-account-1
        if: matrix.group == 'accounts'
        env:
          ACCOUNT_AUDIT_ORIGIN: http://127.0.0.1:8082
