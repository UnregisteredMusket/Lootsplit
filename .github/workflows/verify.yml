name: Verify preserved functionality
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  # PRs verify feature work once; main always verifies the merged release independently.
  push:
    branches: [main]
# Default token scope for every job. Jobs that run recovery-step.mjs add id-token: write
# for its development telemetry, which monitor-publish.mjs sends only for refs/heads/main
# (the Worker also rejects pull_request tokens). The final gate job keeps read-only scope.
# GitHub cannot vary permissions by event, so same-repository PR runs of those jobs still
# receive an OIDC token; fork PRs never do.
permissions:
  contents: read
# PR runs restart on every push. A main run is never cancelled once started: only a completed
# main verification triggers website-release.yml, so cancelling main runs on each merge left
# production undeployed through a burst of 13 merges (2026-10-22). Pushes that land while a main
# run is going wait as one pending run (GitHub keeps the newest), which verifies the latest main.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  LOOTSPLIT_MONITOR_TELEMETRY: "true"
jobs:
  changes:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # A pull_request checkout is the merge commit; its first parent is the base branch.
          fetch-depth: 2
      - id: scope
        run: node scripts/change-scope.mjs

  build:
    name: Code checks and immutable builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      # The main web build reads successful deploy and verification runs to stamp the website
      # changelog (scripts/web-changelog.mjs).
      actions: read
    outputs:
      website_artifact: ${{ steps.website.outputs.artifact-id }}
      standby_artifact: ${{ steps.standby.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Changelog stamping checks which deployed commits contain each note.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: unit-tests
        run: node scripts/recovery-step.mjs unit-tests 240 npm test
      - name: typecheck
        run: node scripts/recovery-step.mjs typecheck 120 npm run typecheck
      - name: lint
        run: node scripts/recovery-step.mjs lint 120 npm run lint
      - name: Generate current source function inventory
        env:
          INVENTORY_OUTPUT_DIR: test-results/function-inventory
        run: node scripts/function-inventory.mjs
      - name: web-build
        env:
          # Only the main build stamps website changelog notes with their deployed commit and
          # runs; pull request builds validate notes and show none of them.
          LOOTSPLIT_WEB_CHANGELOG: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'release' || '' }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/recovery-step.mjs web-build 240 npm run build:cloudflare
      - run: node scripts/release-artifact.mjs prepare
      - run: node scripts/standby-artifact.mjs prepare
      - name: mobile-build
        run: node scripts/recovery-step.mjs mobile-build 180 npm run build:mobile
      - run: node scripts/standby-artifact.mjs verify
      - name: Confirm audited bytes are unchanged
        run: node scripts/release-artifact.mjs verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: website
        with:
          name: website-release-${{ github.sha }}
          path: dist/website-release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          # A deliberate build-job rerun replaces the candidate and reruns its dependants.
          overwrite: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: standby
        with:
          name: standby-release-${{ github.sha }}
          path: dist/standby-release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          # A deliberate build-job rerun replaces the candidate and reruns its dependants.
          overwrite: true
      - name: Summarize measured verification stages
        if: always()
        run: node scripts/verification-timing.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: browser-audit-build-${{ github.run_attempt }}
          path: test-results/
          retention-days: 30

  development:
    name: Development / ${{ matrix.group }}
    needs: changes
    # Documentation-only pull requests skip browser audits; main always runs them.
    if: needs.changes.outputs.code == 'true'
    # Job timeouts are the earlier test budget plus the browser install step's own 12-minute bound,
    # so a slow runner install cannot consume the time the audits need.
    runs-on: ubuntu-latest
    timeout-minutes: 27
    permissions:
      contents: read
      id-token: write
    strategy:
      # Preserve independent results when another group fails; allow targeted reruns.
      # Seven groups balanced by measured median audit time run at once (account shards first
      # in their jobs); no single group carries the critical path. Rebalance by timing, never by
      # dropping an audit.
      fail-fast: false
      matrix:
        group: [governance, accounts, accounts-2, gameplay, economy, desktop, world]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        timeout-minutes: 12
        uses: ./.github/actions/playwright-chromium
      - name: Start disposable development server
        timeout-minutes: 3
        run: |
          mkdir -p test-results
          npm run dev > test-results/dev-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            # Root redirects to the home view. A 307 alone does not prove the
            # page can render; finish server compilation before cold browsers enter.
            if curl --max-time 10 --location --max-redirs 5 -fsS http://127.0.0.1:8080/ > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "Development server did not become ready" >&2
          exit 1
      - name: dev-campaign-governance
        if: matrix.group == 'governance'
        run: node scripts/recovery-step.mjs dev-campaign-governance 240 node scripts/campaign-governance-browser-audit.mjs
      - name: dev-guest-chat
        if: matrix.group == 'governance'
        run: node scripts/recovery-step.mjs dev-guest-chat 180 node --experimental-strip-types scripts/guest-chat-browser-check.mjs
      - name: dev-theme
        if: matrix.group == 'governance'
        run: node scripts/recovery-step.mjs dev-theme 240 node scripts/theme-browser-audit.mjs
      - name: dev-help
        if: matrix.group == 'governance'
        run: node scripts/recovery-step.mjs dev-help 240 node scripts/help-browser-audit.mjs
      - name: dev-account-1
        if: matrix.group == 'accounts'
        env:
          ACCOUNT_SHARD: 1/2
        run: node scripts/recovery-step.mjs dev-account-1 240 node scripts/account-browser-audit.mjs
      - name: dev-owner
        if: matrix.group == 'accounts'
        env:
          AUDIT_ORIGIN: http://127.0.0.1:8080
        run: node scripts/recovery-step.mjs dev-owner 240 node scripts/owner-browser-audit.mjs
      - name: dev-member
        if: matrix.group == 'accounts'
        run: node scripts/recovery-step.mjs dev-member 240 node scripts/member-browser-audit.mjs
      - name: dev-community
        if: matrix.group == 'accounts'
