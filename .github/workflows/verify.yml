name: Verify preserved functionality
on:
  pull_request:
  push:
    branches: [main, 'improvement/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:cloudflare
      - run: npm run build:mobile
      - run: npx playwright install --with-deps chromium
      - name: Browser recovery and UI checks
        run: |
          npm run dev > /tmp/lootsplit-dev.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/ > /dev/null; then break; fi
            sleep 2
          done
          node scripts/release-browser-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-audit
          path: test-results/

