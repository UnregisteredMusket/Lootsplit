name: Report workflow failure
on:
  workflow_run:
    workflows:
      [
        Verify preserved functionality,
        Deploy verified website,
        Publish verified standby,
        Android signed release APK,
        Android test APK,
        Encrypted offsite database backup,
        Verify remote standby recovery,
      ]
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: failure-report-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false
jobs:
  report:
    if: >-
      contains(fromJSON('["failure","timed_out","cancelled","action_required","stale"]'), github.event.workflow_run.conclusion) &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.repository == 'UnregisteredMusket/Lootsplit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Always use trusted default-branch scripts; never execute a failing PR's code.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Save report and send configured email
        env:
          GH_TOKEN: ${{ github.token }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FAILURE_REPORT_EMAIL: ${{ secrets.FAILURE_REPORT_EMAIL }}
          FAILURE_REPORT_FROM: ${{ secrets.FAILURE_REPORT_FROM }}
        run: node scripts/failure-report.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failure-report-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: test-results/failure-report/
          if-no-files-found: warn
          retention-days: 90
