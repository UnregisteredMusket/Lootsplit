name: Verify existing live website (read only)
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact deployed main commit to verify
        required: true
      verification_run_id:
        description: Successful main verification run containing its immutable website artifact
        required: true
# No OIDC token: no step here runs through scripts/recovery-step.mjs, the only telemetry
# publisher. If a step is wrapped in it later, grant `id-token: write` on that job only.
permissions:
  contents: read
  actions: read
env:
  LOOTSPLIT_MONITOR_TELEMETRY: "true"
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      EXPECTED_RELEASE_SHA: ${{ inputs.release_sha }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      AUDIT_ORIGIN: https://lootsplitter.com
      # Other approved origins (origins.mjs legacy minus website); empty while there are none.
      AUDIT_LEGACY_ORIGINS: "https://lootsplit.oliverstorie2017.workers.dev"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: website-release-${{ inputs.release_sha }}
          path: dist/website-release
          run-id: ${{ inputs.verification_run_id }}
          github-token: ${{ github.token }}
      - run: node scripts/release-artifact.mjs verify
      - name: Verify deployed runtime policy without changing it
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/runtime-policy.mjs
      - run: npx playwright install --with-deps chromium
      - name: Verify identity, asset bytes and desktop/mobile behavior without deploying
        run: |
          node scripts/live-audit-origins.mjs scripts/live-release-audit.mjs
          node scripts/live-audit-origins.mjs scripts/website-browser-audit.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: live-verification-${{ inputs.release_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 30
