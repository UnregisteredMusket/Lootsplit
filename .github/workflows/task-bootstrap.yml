# Temporary development bootstrap: remove before merging the feature.
# Only committed source and public locked tooling; no credentials, databases or user fixtures.
name: Post-session viewing development bootstrap
on:
  push:
    branches: [feature/post-session-viewing]
    paths: [.github/workflows/task-bootstrap.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare isolated tooling
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/task-tools/browser
        run: |
          mkdir -p "$RUNNER_TEMP/task-tools" "$RUNNER_TEMP/task-export"
          npx playwright install chromium --only-shell
          cp "$(command -v node)" "$RUNNER_TEMP/task-tools/node"
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/task-export/source.tar.gz"
          git ls-tree -r HEAD > "$RUNNER_TEMP/task-export/source-tree.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/task-export/source-commit.txt"
          tar -czf "$RUNNER_TEMP/task-export/dependencies.tar.gz" node_modules
          tar -czf "$RUNNER_TEMP/task-export/tools.tar.gz" -C "$RUNNER_TEMP/task-tools" node browser
          cd "$RUNNER_TEMP/task-export"
          sha256sum *.tar.gz > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: post-session-viewing-development
          path: ${{ runner.temp }}/task-export/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
