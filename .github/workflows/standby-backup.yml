name: Encrypted offsite database backup
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/standby-backup.mjs, .github/workflows/standby-backup.yml]
  schedule:
    - cron: '17 9 * * *'
permissions:
  contents: read
  # scripts/production-lane.mjs reads website release runs.
  actions: read
# Its own queue (audit G10): sharing lootsplit-production let a queued backup cancel a pending
# deploy (GitHub keeps one pending run per group). Backups and releases stay apart through
# scripts/production-lane.mjs instead. Nothing restores automatically.
concurrency:
  group: lootsplit-backup
  cancel-in-progress: false
jobs:
  backup:
    if: github.ref == 'refs/heads/main' && vars.STANDBY_BACKUPS_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    # Up to 25 minutes waiting for a running website release, then the export (12-minute limit).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Wait for a running website release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/production-lane.mjs wait-for-release
      # The step name is read by scripts/production-lane.mjs (BACKUP_EXPORT_STEP); keep them equal.
      # Validates against the migrations of the commit that is live (audit G13), fetched from git.
      - name: Export consistently and encrypt before writing to disk
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: node scripts/standby-backup.mjs export
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: encrypted-d1-${{ github.run_id }}
          path: recovery/encrypted/*.enc
          if-no-files-found: error
          retention-days: 30
      - name: Remove encrypted runner copies
        if: always()
        run: rm -rf recovery/encrypted
