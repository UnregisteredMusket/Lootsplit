name: Verify remote standby recovery
on:
  workflow_dispatch:
  schedule:
    - cron: "43 8 * * 1"
  push:
    branches: [main]
    paths:
      - scripts/standby-remote-check.mjs
      - .github/workflows/standby-check.yml
permissions:
  contents: read
concurrency:
  group: lootsplit-standby-rehearsal
  cancel-in-progress: false
jobs:
  rehearsal:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify synthetic recovery on the dedicated empty standby
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: node scripts/standby-remote-check.mjs
      - name: Check remaining backup configuration
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUPS_ENABLED: ${{ vars.STANDBY_BACKUPS_ENABLED }}
        run: |
          node --input-type=module -e 'const key = process.env.BACKUP_ENCRYPTION_KEY; console.log(/^[a-fA-F0-9]{64}$/.test(key || "") ? "Backup encryption key is configured." : "SETUP REQUIRED: add BACKUP_ENCRYPTION_KEY (64 random hexadecimal characters) to the production environment."); console.log(process.env.BACKUPS_ENABLED === "true" ? "Daily backups are enabled." : "SETUP REQUIRED: set repository variable STANDBY_BACKUPS_ENABLED=true after retaining your backup key securely.");'
