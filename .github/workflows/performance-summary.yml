name: Weekly development speed summary
on:
  workflow_dispatch:
  schedule:
    - cron: "23 13 * * 1"
permissions:
  contents: read
  actions: read
jobs:
  summary:
    if: github.repository == 'UnregisteredMusket/Lootsplit'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Summarize verification time for the last two weeks
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/performance-summary.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: development-speed-${{ github.run_id }}
          path: test-results/performance/weekly-summary.md
          if-no-files-found: warn
          retention-days: 90
