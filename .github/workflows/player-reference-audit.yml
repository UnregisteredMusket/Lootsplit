name: Focused player references
on:
  pull_request:
    paths:
      - .github/workflows/player-reference-audit.yml
      - scripts/player-reference-browser-audit.mjs
      - scripts/browser/account-fixtures.mjs
      - src/lib/quire/reference-access.ts
      - src/lib/quire/use-reference-access.ts
      - src/lib/quire/open5e-api.ts
      - src/lib/help/**
      - src/components/help-content.tsx
      - src/components/open5e-browser.tsx
      - src/routes/library.tsx
permissions:
  contents: read
concurrency:
  group: player-references-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    name: Player references / ${{ matrix.runtime }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runtime: [development, worker]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start disposable development server
        id: development
        if: matrix.runtime == 'development'
        run: |
          mkdir -p test-results
          npm run dev > test-results/dev-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --max-time 2 -fsS http://127.0.0.1:8080/welcome > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Build and start disposable immutable Worker
        id: worker
        if: matrix.runtime == 'worker'
        run: |
          mkdir -p test-results
          npm run build:cloudflare
          node scripts/release-artifact.mjs prepare
          node scripts/release-artifact.mjs verify
          npx wrangler d1 migrations apply DB --local
          npx wrangler dev --config dist/website-release/wrangler.toml --no-bundle --persist-to .wrangler/state --local --port 8082 --var ACCOUNT_ORIGIN:http://127.0.0.1:8082 --var ACCOUNT_SECRET:disposable-ci-only-account-secret-123456789 > test-results/worker-server.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl --max-time 2 -fsS http://127.0.0.1:8082/welcome > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Verify player references and Help
        env:
          AUDIT_ORIGIN: ${{ matrix.runtime == 'worker' && 'http://127.0.0.1:8082' || 'http://127.0.0.1:8080' }}
        run: node scripts/recovery-step.mjs focused-player-references 180 node scripts/player-reference-browser-audit.mjs
      - name: Verify complete account fixtures
        if: always() && (steps.development.outcome == 'success' || steps.worker.outcome == 'success')
        env:
          ACCOUNT_AUDIT_ORIGIN: ${{ matrix.runtime == 'worker' && 'http://127.0.0.1:8082' || 'http://127.0.0.1:8080' }}
        run: node scripts/recovery-step.mjs focused-account-fixtures 180 node scripts/account-browser-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-player-references-${{ matrix.runtime }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 30
