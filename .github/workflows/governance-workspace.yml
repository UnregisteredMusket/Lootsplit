name: Governance workspace snapshot
on:
  push:
    branches: [fix/campaign-governance-and-session-records]
    paths: [.github/workflows/governance-workspace.yml]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository == 'UnregisteredMusket/Lootsplit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package source for isolated verification
        run: git archive --format=zip --output=/tmp/lootsplit-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: lootsplit-governance-source
          path: /tmp/lootsplit-source.zip
          retention-days: 1
