name: Governance workspace snapshot
on:
  push:
    branches: [fix/campaign-governance-and-session-records]
    paths: [.github/workflows/governance-workspace.yml]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository == 'UnregisteredMusket/Lootsplit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Package locked dependencies for isolated tests
        run: tar -czf /tmp/lootsplit-dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: lootsplit-governance-dependencies
          path: /tmp/lootsplit-dependencies.tar.gz
          retention-days: 1
