name: Record performance regressions
on:
  workflow_dispatch:
  # Hourly collection (owner-approved 2026-10-21). It reads every completed run since its cursor,
  # so no data is lost; it no longer starts a workflow after every other workflow finishes.
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: write
  actions: read
concurrency:
  group: lootsplit-performance-history
  cancel-in-progress: false
jobs:
  record:
    if: github.repository == 'UnregisteredMusket/Lootsplit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Never check out a triggering PR or consume its executable artifacts.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Compare timings and commit the persistent data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/performance-sync.mjs --publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: performance-history-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/performance/
          if-no-files-found: warn
          retention-days: 90
