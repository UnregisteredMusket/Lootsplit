name: Record performance regressions
on:
  workflow_run:
    workflows:
      [
        Verify preserved functionality,
        Deploy verified website,
        Verify existing live website (read only),
        Publish verified standby,
        Android signed release APK,
        Android test APK,
        Encrypted offsite database backup,
        Verify remote standby recovery,
        Report workflow failure,
      ]
    types: [completed]
  workflow_dispatch:
  # Catch up if GitHub replaced a pending workflow_run or an API outage interrupted it.
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: write
  actions: read
concurrency:
  group: lootsplit-performance-history
  cancel-in-progress: false
jobs:
  record:
    if: github.repository == 'UnregisteredMusket/Lootsplit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Never check out a triggering PR or consume its executable artifacts.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare timings and commit the persistent data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/performance-sync.mjs --publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-history-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/performance/
          if-no-files-found: warn
          retention-days: 90
