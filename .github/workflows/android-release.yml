name: Android signed release APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "src/lib/quire/version.ts"
      - ".github/workflows/android-release.yml"

permissions:
  id-token: write
  contents: write
  actions: read

concurrency:
  group: android-release
  cancel-in-progress: false

env:
  LOOTSPLIT_MONITOR_TELEMETRY: "true"
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  native:
    uses: ./.github/workflows/android-widget.yml
  main-verification:
    needs: [verify, native]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require successful independent main preservation checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/recovery-step.mjs android-main-verification 660 node scripts/android-main-verification.mjs
  release-apk:
    needs: [verify, native, main-verification]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require main release source
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:cloudflare
      - name: Verify release version
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-android-release.mjs
      - run: npm run build:mobile && npx cap sync android
      - name: Require current main before signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
      - name: Sign release with permanent key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/lootsplit-release.jks
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          for setting in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!setting}" ]; then
              echo "::error::Missing repository secret: $setting"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          cd android
          node ../scripts/recovery-step.mjs android-signing-build 600 ./gradlew assembleRelease
          certificate_report=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk)
          printf '%s\n' "$certificate_report"
          actual_fingerprint=$(printf '%s\n' "$certificate_report" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]')
          expected_fingerprint=baca95a880d14d0d8c422c397decd4c9bf0e7f710a3fd6a5be1e47abd3f730a0
          if [ "$actual_fingerprint" != "$expected_fingerprint" ]; then
            echo "::error::APK certificate does not match Lootsplit's permanent signing key"
            exit 1
          fi
      - name: Enable emulator acceleration for signed upgrade verification
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify signed upgrade and actual companion installation from Widgets
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: python3 scripts/android-widget-upgrade-audit.py
      - name: Preserve signed upgrade and picker evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-signed-widget-upgrade
          path: test-results/android-widget/
          retention-days: 30
      - name: Upload signed APK only
        uses: actions/upload-artifact@v4
        with:
          name: lootsplit-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish versioned download and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          version=$(sed -n 's/.*APP_VERSION = "\([^"]*\)".*/\1/p' src/lib/quire/version.ts)
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/Lootsplit-$version.apk"
          (cd release && sha256sum "Lootsplit-$version.apk" > SHA256SUMS.txt)
          python3 - <<'PY'
          from pathlib import Path
          import re
          notes = Path("docs/RELEASE-NOTES.md").read_text().split("\n---\n", 1)[0]
          notes = re.sub(r"^(# Lootsplit [0-9.]+).*", r"\1", notes, count=1)
          notes = notes.replace("This candidate retains", "This release retains").replace("## Candidate verification", "## Verification")
          notes = notes.replace("Not yet published. API24/API35, complete PR/main preservation checks and the signed-APK upgrade gate must pass.", "Published after API24/API35, complete PR/main preservation checks and the signed-APK upgrade gate passed.")
          notes = re.sub(r"The public download remains [0-9.]+ until the new signed APK and checksum exist\. ?", "", notes)
          Path("release/RELEASE-NOTES.md").write_text(notes)
          PY
          node scripts/recovery-step.mjs android-publish 180 gh release create "android-v$version" "release/Lootsplit-$version.apk" release/SHA256SUMS.txt --target "$GITHUB_SHA" --title "Lootsplit $version for Android" --notes-file release/RELEASE-NOTES.md
