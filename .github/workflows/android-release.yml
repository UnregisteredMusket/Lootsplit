name: Android signed release APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "src/lib/quire/version.ts"
      - ".github/workflows/android-release.yml"

# Least privilege by default. Each job below grants only what its own steps use; a job's
# permissions replace these defaults and cap any reusable workflow it calls.
permissions:
  contents: read
  actions: read

concurrency:
  group: android-release
  cancel-in-progress: false

env:
  LOOTSPLIT_MONITOR_TELEMETRY: "true"
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read
      # verify.yml's recovery steps publish main-push OIDC development telemetry.
      id-token: write
  native:
    uses: ./.github/workflows/android-widget.yml
    permissions:
      contents: read
  main-verification:
    needs: [verify, native]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Reads the independent verify.yml main-push run and its jobs.
      actions: read
      # recovery-step.mjs telemetry (main pushes only).
      id-token: write
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Require successful independent main preservation checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/recovery-step.mjs android-main-verification 660 node scripts/android-main-verification.mjs
  release-apk:
    needs: [verify, native, main-verification]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Builds and signs only. The signing keystore never shares a job with the emulator runner or
    # with a release-writing token: upgrade-gate tests and publish-apk publishes this exact file,
    # pinned by the SHA-256 this job outputs after checking the permanent certificate.
    permissions:
      contents: read
      # recovery-step.mjs telemetry for android-signing-build (main pushes only).
      id-token: write
    outputs:
      skip: ${{ steps.release-check.outputs.skip }}
      apk-sha256: ${{ steps.sign.outputs.apk-sha256 }}
    steps:
      - name: Require main release source
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # No shared npm cache is restored into the job that decodes the signing keystore.
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:cloudflare
      - name: Verify release version
        id: release-check
        env:
          GH_TOKEN: ${{ github.token }}
        # A push that leaves APP_VERSION unchanged (e.g. a workflow-only edit) on an already
        # released version ends successfully without signing; any other case still fails.
        run: node scripts/check-android-release.mjs --skip-released-unchanged
      - run: npm run build:mobile && npx cap sync android
        if: steps.release-check.outputs.skip != 'true'
      - name: Require current main before signing
        if: steps.release-check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
      - name: Sign release with permanent key
        id: sign
        if: steps.release-check.outputs.skip != 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/lootsplit-release.jks
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          for setting in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!setting}" ]; then
              echo "::error::Missing repository secret: $setting"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          cd android
          node ../scripts/recovery-step.mjs android-signing-build 600 ./gradlew assembleRelease
          certificate_report=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk)
          printf '%s\n' "$certificate_report"
          actual_fingerprint=$(printf '%s\n' "$certificate_report" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]')
          expected_fingerprint=baca95a880d14d0d8c422c397decd4c9bf0e7f710a3fd6a5be1e47abd3f730a0
          if [ "$actual_fingerprint" != "$expected_fingerprint" ]; then
            echo "::error::APK certificate does not match Lootsplit's permanent signing key"
            exit 1
          fi
          apk_sha256=$(sha256sum app/build/outputs/apk/release/app-release.apk | cut -d ' ' -f 1)
          echo "Signed APK SHA-256: $apk_sha256"
          echo "apk-sha256=$apk_sha256" >> "$GITHUB_OUTPUT"
      - name: Hand the signed APK to the upgrade gate and publisher
        if: steps.release-check.outputs.skip != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # Not the public secondary download: lootsplit-release-apk is uploaded only after the
          # upgrade gate passes, as before.
          name: lootsplit-signed-apk-candidate
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 1
  upgrade-gate:
    needs: [release-apk]
    if: needs.release-apk.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No secrets and no write access: installs the previous public release, then upgrades it in
    # place with the exact signed APK from release-apk.
    permissions:
      contents: read
    steps:
      - name: Require main release source
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lootsplit-signed-apk-candidate
          path: android/app/build/outputs/apk/release
      - name: Require the exact signed APK
        env:
          EXPECTED_APK_SHA256: ${{ needs.release-apk.outputs.apk-sha256 }}
        run: |
          test -n "$EXPECTED_APK_SHA256"
          echo "$EXPECTED_APK_SHA256  android/app/build/outputs/apk/release/app-release.apk" | sha256sum --check --strict
      - name: Enable emulator acceleration for signed upgrade verification
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify signed upgrade and actual companion installation from Widgets
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: python3 scripts/android-widget-upgrade-audit.py
      - name: Preserve signed upgrade and picker evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: android-signed-widget-upgrade
          path: test-results/android-widget/
          retention-days: 30
  publish-apk:
    needs: [release-apk, upgrade-gate]
    if: needs.release-apk.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job that can write releases. No Android SDK, emulator, npm install or signing key:
    # it publishes the file whose SHA-256 release-apk recorded after the certificate check.
    permissions:
      # gh release create.
      contents: write
      # recovery-step.mjs telemetry for android-publish (main pushes only).
      id-token: write
    steps:
      - name: Require main release source
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lootsplit-signed-apk-candidate
          path: android/app/build/outputs/apk/release
      - name: Require the exact signed APK that passed the upgrade gate
        env:
          EXPECTED_APK_SHA256: ${{ needs.release-apk.outputs.apk-sha256 }}
        run: |
          test -n "$EXPECTED_APK_SHA256"
          echo "$EXPECTED_APK_SHA256  android/app/build/outputs/apk/release/app-release.apk" | sha256sum --check --strict
      - name: Upload signed APK only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lootsplit-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish versioned download and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          version=$(sed -n 's/.*APP_VERSION = "\([^"]*\)".*/\1/p' src/lib/quire/version.ts)
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/Lootsplit-$version.apk"
          (cd release && sha256sum "Lootsplit-$version.apk" > SHA256SUMS.txt)
          python3 - <<'PY'
          from pathlib import Path
          import re
          notes = Path("docs/RELEASE-NOTES.md").read_text().split("\n---\n", 1)[0]
          notes = re.sub(r"^(# Lootsplit [0-9.]+).*", r"\1", notes, count=1)
          notes = notes.replace("This candidate retains", "This release retains").replace("## Candidate verification", "## Verification")
          notes = notes.replace("Not yet published. API24/API35, complete PR/main preservation checks and the signed-APK upgrade gate must pass.", "Published after API24/API35, complete PR/main preservation checks and the signed-APK upgrade gate passed.")
          notes = notes.replace("Not yet published. API 24/API 35, complete PR/main preservation checks and the signed-APK upgrade gate must pass.", "Published after API 24/API 35, complete PR/main preservation checks and the signed-APK upgrade gate passed.")
          notes = re.sub(r"The public download remains [0-9.]+ until the new signed APK and checksum exist\. ?", "", notes)
          Path("release/RELEASE-NOTES.md").write_text(notes)
          PY
          node scripts/recovery-step.mjs android-publish 180 gh release create "android-v$version" "release/Lootsplit-$version.apk" release/SHA256SUMS.txt --target "$GITHUB_SHA" --title "Lootsplit $version for Android" --notes-file release/RELEASE-NOTES.md
