name: Android signed release APK

on:
  workflow_dispatch:
  push:
    branches: ["android/update-1.3.0"]
    paths:
      - ".github/workflows/android-release.yml"

permissions:
  contents: read

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - run: npm ci
      - run: npm run build:mobile && npx cap sync android
      - name: Sign release with permanent key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/lootsplit-release.jks
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          for setting in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!setting}" ]; then
              echo "::error::Missing repository secret: $setting"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          cd android
          ./gradlew assembleRelease
          certificate_report=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk)
          printf '%s\n' "$certificate_report"
          actual_fingerprint=$(printf '%s\n' "$certificate_report" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]')
          expected_fingerprint=baca95a880d14d0d8c422c397decd4c9bf0e7f710a3fd6a5be1e47abd3f730a0
          if [ "$actual_fingerprint" != "$expected_fingerprint" ]; then
            echo "::error::APK certificate does not match Lootsplit's permanent signing key"
            exit 1
          fi
      - name: Upload signed APK only
        uses: actions/upload-artifact@v4
        with:
          name: lootsplit-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
