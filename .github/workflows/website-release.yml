name: Deploy verified website
on:
  workflow_run:
    workflows: [Verify preserved functionality]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
# All website publishers must use this group. Never cancel an active upload.
concurrency:
  group: lootsplit-production
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.repository == 'UnregisteredMusket/Lootsplit'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked deploy and verification tools (no application build)
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: website-release-${{ env.RELEASE_SHA }}
          path: dist/website-release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Validate the exact verified artifact
        env:
          GITHUB_SHA: ${{ env.RELEASE_SHA }}
        run: node scripts/release-artifact.mjs verify
      - run: npx playwright install --with-deps chromium
      - name: Check current main, existing bindings and applied migrations; deploy without rebuild
        env:
          GITHUB_SHA: ${{ env.RELEASE_SHA }}
          GITHUB_REF: refs/heads/main
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/production-preflight.mjs
          npx wrangler deploy --config dist/website-release/wrangler.toml --no-bundle --keep-vars --message "GitHub verified $RELEASE_SHA run ${{ github.event.workflow_run.id }}"
      - name: Verify deployed identity and read-only desktop/mobile website behavior
        env:
          EXPECTED_RELEASE_SHA: ${{ env.RELEASE_SHA }}
          AUDIT_ORIGIN: https://lootsplit.oliverstorie2017.workers.dev
        run: |
          node scripts/live-release-audit.mjs
          node scripts/website-browser-audit.mjs
      - name: Record release result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          printf 'Website commit: `%s`\n\nVerification run: %s\n\nResult: %s\n' "$RELEASE_SHA" '${{ github.event.workflow_run.html_url }}' "$JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-verification-${{ env.RELEASE_SHA }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 30
