name: Deploy verified website
on:
  workflow_run:
    workflows: [Verify preserved functionality]
    types: [completed]
    branches: [main]
# Least privilege by default; the deploy job adds only the OIDC token its own steps use.
permissions:
  contents: read
  actions: read
# All website publishers must use this group. Never cancel an active upload. The database backup
# has its own group (standby-backup.yml) and coordinates through scripts/production-lane.mjs.
concurrency:
  group: lootsplit-production
  cancel-in-progress: false
env:
  LOOTSPLIT_MONITOR_TELEMETRY: "true"
jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.repository == 'UnregisteredMusket/Lootsplit'
    runs-on: ubuntu-latest
    environment: production
    # Deploy plus live audits of two origins (lootsplitter.com + workers.dev) since PR 214, plus up
    # to 15 minutes waiting for a running database backup export (scripts/production-lane.mjs).
    timeout-minutes: 40
    # A job's permissions replace the workflow defaults, so list everything this job uses.
    permissions:
      contents: read
      # download-artifact from the verification run.
      actions: read
      # recovery-step.mjs telemetry (production-migrations, production-preflight, website-deploy,
      # website-live-audit, website-browser-audit) authenticates with a GitHub OIDC token.
      id-token: write
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked deploy and verification tools (no application build)
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: website-release-${{ env.RELEASE_SHA }}
          path: dist/website-release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Validate the exact verified artifact
        run: node scripts/release-artifact.mjs verify
      - name: Install Chromium for Playwright
        timeout-minutes: 12
        uses: ./.github/actions/playwright-chromium
      # A release whose commit is no longer the head of main is superseded: it stops here, before
      # migrations and deploy, exactly as before, but ends success instead of a false failure.
      # Every production step below is guarded on this output; only a real deploy reaches
      # "Record live deployment", which readers use to tell deployments apart
      # (src/lib/deployment/release-run.mjs). Migrations and preflight still assert current main.
      # The backup has its own concurrency group (audit G10); a running D1 export blocks every
      # database request, so wait for it before migrating (scripts/production-lane.mjs). Runs
      # before the current-main check, so a long wait cannot turn a newer main into a failure.
      - name: Wait for a running database backup export
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/production-lane.mjs wait-for-backup-export
      - name: Check the release commit is still the head of main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-current.mjs
      # Additive-only SQL from the verified artifact; anything else, or a failed apply, stops the
      # release here and the current Worker keeps serving. Never apply migrations by hand.
      - name: Apply pending additive D1 migrations and read back the ledger
        if: steps.current.outputs.superseded != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_MIGRATION_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_TOKEN }}
        run: node scripts/recovery-step.mjs production-migrations 300 node scripts/production-migrations.mjs
      - name: Check current main, existing bindings and applied migrations; deploy without rebuild
        id: deploy
        if: steps.current.outputs.superseded != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/recovery-step.mjs production-preflight 120 node scripts/production-preflight.mjs
          node scripts/recovery-step.mjs website-deploy 300 npx wrangler deploy --config dist/website-release/wrangler.toml --no-bundle --keep-vars --message "GitHub verified $RELEASE_SHA run ${{ github.event.workflow_run.id }}"
      - name: Verify deployed CPU and observability policy
        if: steps.current.outputs.superseded != 'true'
        env:
          EXPECTED_RELEASE_SHA: ${{ env.RELEASE_SHA }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/runtime-policy.mjs
      - name: Record failure-email readiness without sending mail
        if: steps.current.outputs.superseded != 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FAILURE_REPORT_EMAIL: ${{ secrets.FAILURE_REPORT_EMAIL }}
          FAILURE_REPORT_FROM: ${{ secrets.FAILURE_REPORT_FROM }}
        run: node scripts/failure-report.mjs --check-config
      # Once the deploy succeeded the commit is serving: audit it even if a policy check above
      # failed. Both audits are recovery steps, so a failure leaves an annotation (audit G6).
      - name: Verify deployed identity and read-only desktop/mobile website behavior
        id: audit
        if: ${{ !cancelled() && steps.current.outputs.superseded != 'true' && steps.deploy.outcome == 'success' }}
        env:
          EXPECTED_RELEASE_SHA: ${{ env.RELEASE_SHA }}
          AUDIT_ORIGIN: https://lootsplitter.com
          # Other approved origins (src/lib/deployment/origins.mjs legacy minus website), audited
          # the same way; empty while the website is the only origin. migration:check enforces it.
          AUDIT_LEGACY_ORIGINS: "https://lootsplit.oliverstorie2017.workers.dev"
        run: |
          node scripts/recovery-step.mjs website-live-audit 180 node scripts/live-audit-origins.mjs scripts/live-release-audit.mjs
          node scripts/recovery-step.mjs website-browser-audit 600 node scripts/live-audit-origins.mjs scripts/website-browser-audit.mjs
      # Runs whenever this commit was deployed. Its success is the deployment marker the web
      # changelog and owner monitor read (src/lib/deployment/release-run.mjs); never rename or
      # unguard it without updating that file and scripts/release-run.test.mjs. Owner decision for
      # audit G6 (2026-11-11): a deployed commit whose live audit did not pass stays live, is
      # recorded as deployed and flagged "live, unaudited"; the run still ends red because the
      # audit step failed. Nothing is rolled back.
      - name: Record live deployment
        if: ${{ always() && steps.current.outputs.superseded != 'true' && steps.deploy.outcome == 'success' }}
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          if [ "$AUDIT_OUTCOME" = "success" ]; then
            printf 'Deployed and live-audited: `%s`\n\n' "$RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=Live, unaudited::$RELEASE_SHA is deployed and serving, but its read-only live audit did not pass (audit step: $AUDIT_OUTCOME). It stays live. Read the website-live-audit or website-browser-audit annotation, then fix forward; a rollback is the owner's call."
            printf 'Deployed, **live, unaudited**: `%s` (live audit: %s). The commit is serving; read the audit annotation.\n\n' "$RELEASE_SHA" "$AUDIT_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Record release result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          SUPERSEDED: ${{ steps.current.outputs.superseded }}
        run: |
          if [ "$SUPERSEDED" = "true" ]; then JOB_STATUS="superseded (main advanced; nothing migrated or deployed)"; fi
          printf 'Website commit: `%s`\n\nVerification run: %s\n\nResult: %s\n' "$RELEASE_SHA" '${{ github.event.workflow_run.html_url }}' "$JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: production-verification-${{ env.RELEASE_SHA }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 30
