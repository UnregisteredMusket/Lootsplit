# Temporary branch-only publication bridge; removed from the resulting source tree.
# Applies only the already locally tested, checksum-pinned patch. No secrets or production access.
name: Publish verified post-session source
on:
  push:
    branches: [feature/post-session-viewing]
    paths: [.github/workflows/task-apply.yml]
permissions:
  contents: write
concurrency:
  group: post-session-source-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'UnregisteredMusket/Lootsplit' && github.ref == 'refs/heads/feature/post-session-viewing'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruct and verify the exact locally tested tree
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 0a14721be6a0bcd66729035932831c3b6e3f4150
          test "$(git ls-remote origin refs/heads/feature/post-session-viewing | cut -f1)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 6ba8fb40ae97219a9c74a5000849808bce091dc6 HEAD
          gh api repos/UnregisteredMusket/Lootsplit/git/blobs/c0d738dbb80db4426fb2299597e86620446290d6 --jq .content | base64 --decode > "$RUNNER_TEMP/viewing-1.bin"
          gh api repos/UnregisteredMusket/Lootsplit/git/blobs/1fff36387b748f5b53ca9a25b109e0daba2d301b --jq .content | base64 --decode > "$RUNNER_TEMP/viewing-2.bin"
          python3 - <<'PY'
          import hashlib,lzma,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          compressed=(root/'viewing-1.bin').read_bytes()+(root/'viewing-2.bin').read_bytes()
          patch=lzma.decompress(compressed)
          assert len(patch)==89744
          assert hashlib.sha256(patch).hexdigest()=='73dc5f1bb73350ea3ec543cac475e894c259724c3fabdfaeddd4333b6f96ee19'
          (root/'viewing.patch').write_bytes(patch)
          PY
          # Only the disposable checkout is reset. The resulting commit retains the current branch parent.
          git read-tree --reset -u 6ba8fb40ae97219a9c74a5000849808bce091dc6
          git apply --index --unidiff-zero --binary "$RUNNER_TEMP/viewing.patch"
          test "$(git write-tree)" = 237a631591983c6f3284d667460274ad7c79d0d4
          test ! -e .github/workflows/task-bootstrap.yml
          test ! -e .github/workflows/task-apply.yml
          git diff --exit-code
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add optional read-only rooms after a session ends'
          source_sha=$(git rev-parse HEAD)
          echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          printf 'Source: `%s`\n\nVerified source tree: `237a631591983c6f3284d667460274ad7c79d0d4`\n' "$source_sha" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve the measured local audit reference
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          history=$(gh api repos/UnregisteredMusket/Lootsplit/git/ref/heads/performance-history --jq .object.sha)
          mkdir -p test-results/performance
          for file in baselines.json state.json; do
            gh api "repos/UnregisteredMusket/Lootsplit/contents/$file?ref=$history" --jq .content | base64 --decode > "test-results/performance/$file"
          done
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          source=os.environ['SOURCE_SHA']
          record={'kind':'audit','name':'post-session viewing browser preservation','environment':'node22.23.3/linux-x64/chat-container/chromium153/single-worker/disposable-fixture','scopeVersion':'v1-guest-account-startup-sheet-chat-portrait-revocation-reopen','commit':source,'url':f'https://github.com/UnregisteredMusket/Lootsplit/commit/{source}','outcome':'success','startedAt':'2026-10-07T08:47:10.177Z','finishedAt':'2026-10-07T08:48:24.728654Z','durationMs':74551.654}
          Path(os.environ['RUNNER_TEMP'],'local-measurement.json').write_text(json.dumps(record))
          PY
          node scripts/performance-record.mjs "$RUNNER_TEMP/local-measurement.json"
          test "$(git diff --name-only)" = performance/manual-measurements.jsonl
          git add performance/manual-measurements.jsonl
          git commit -m 'Record the local post-session viewing audit reference'
          test "$(git diff --name-only "$SOURCE_SHA" HEAD)" = performance/manual-measurements.jsonl
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 0a14721be6a0bcd66729035932831c3b6e3f4150
          test "$(git ls-remote origin refs/heads/feature/post-session-viewing | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/feature/post-session-viewing
          printf '\nPublished branch head: `%s`\n\nNo main merge, deployment or signing performed. Open a PR and require every preservation gate.\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
