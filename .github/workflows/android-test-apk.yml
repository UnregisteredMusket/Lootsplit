name: Android test APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'android/**'
      - 'improvement/**'
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'cloudflare/**'
      - 'package*.json'
      - 'capacitor.config.*'
      - 'vite*.config.*'
      - 'scripts/prepare-mobile.mjs'
      - 'scripts/with-app-env.mjs'
      - 'scripts/app-env-plugin.mjs'
      - '.grok/app-env.json'
      - '.github/workflows/android-test-apk.yml'

# No step publishes OIDC telemetry (no recovery-step.mjs), so no id-token is requested.
permissions:
  contents: read

concurrency:
  group: android-test-${{ github.ref }}
  cancel-in-progress: true

env:
  LOOTSPLIT_MONITOR_TELEMETRY: "true"
jobs:
  test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - run: npm ci
      - run: npm run build:android
      - name: Upload test APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lootsplit-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
