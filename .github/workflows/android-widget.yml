name: Android native widget verification
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: ["android/field-monitor"]
  pull_request:
    paths:
      - "android/**"
      - "src/lib/mobile/**"
      - "src/lib/account/client.ts"
      - "src/components/account/mobile-owner-widget.tsx"
      - ".github/workflows/android-widget.yml"
      - ".github/workflows/android-release.yml"
# No step publishes OIDC telemetry (no recovery-step.mjs), so no id-token is requested.
permissions:
  contents: read
env:
  LOOTSPLIT_MONITOR_TELEMETRY: "true"
jobs:
  native-widget:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [24, 35]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - run: npm ci
      - run: npm run build:mobile && npx cap sync android
      - name: Install browser for native account controls
        if: matrix.api == 35
        run: npx playwright install --with-deps chromium
      - name: Verify mobile widget controls
        if: matrix.api == 35
        run: node scripts/mobile-owner-widget-browser-audit.mjs
      - name: Compile native app, instrumentation and lint
        run: cd android && ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug --no-daemon
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify owner isolation, refresh transport and actual RemoteViews layouts
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            set -e
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            python3 scripts/android-widget-picker-audit.py ${{ matrix.api == 35 && '--add-companion' || '' }}
            adb uninstall com.unregisteredmusket.lootsplit
            bash scripts/android-widget-instrumentation.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: android-widget-verification-${{ matrix.api }}-${{ github.run_attempt }}
          path: |
            test-results/android-widget/
            test-results/android-widget-controls/
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
          retention-days: 30
