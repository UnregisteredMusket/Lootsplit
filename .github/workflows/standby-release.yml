name: Publish verified standby
on:
  workflow_run:
    workflows: [Verify preserved functionality]
    types: [completed]
    branches: [main]
permissions:
  contents: write
  actions: read
concurrency:
  group: lootsplit-standby-publish
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.repository == 'UnregisteredMusket/Lootsplit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: standby-release-${{ env.RELEASE_SHA }}
          path: dist/standby-release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Verify and publish the audited bytes without rebuilding
        run: |
          node --input-type=module -e 'import {verifyArtifact} from "./scripts/release-artifact.mjs"; verifyArtifact("dist/standby-release", process.env.RELEASE_SHA)'
          tar -czf "dist/standby-$RELEASE_SHA.tar.gz" -C dist standby-release
          if gh release view "standby-$RELEASE_SHA" > /dev/null 2>&1; then
            echo 'Immutable release already exists; refusing to replace it.'
            exit 0
          fi
          gh release create "standby-$RELEASE_SHA" "dist/standby-$RELEASE_SHA.tar.gz" --target "$RELEASE_SHA" --prerelease --title "Verified standby $RELEASE_SHA" --notes 'Portable standby tested by the full verification workflow. Contains application code and public assets only. Deployment and recovery instructions: docs/STANDBY.md.'
