name = "lootsplit"
main = "cloudflare/worker.mjs"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Every request, including the interface, goes through the Worker.
# The Worker serves built files from ASSETS and shared rooms from D1.
[assets]
directory = "./dist/client"
binding = "ASSETS"
run_worker_first = true

# Binding name DB is required. database_id is intentionally omitted:
# create the D1 database, then add `database_id = "<id from Cloudflare>"` here.
# Do not guess an id.
[[d1_databases]]
binding = "DB"
database_name = "lootsplit"
migrations_dir = "cloudflare/migrations"
