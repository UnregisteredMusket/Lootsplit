name = "lootsplit"
main = "cloudflare/worker.mjs"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Every request, including the interface, goes through the Worker.
# The Worker serves built files from ASSETS and shared rooms from D1.
[assets]
directory = "./dist/client"
binding = "ASSETS"
run_worker_first = true

# Binding name DB is required. database_id is the lootsplit D1 database.
[[d1_databases]]
binding = "DB"
database_name = "lootsplit"
database_id = "0a200e96-ae2e-47b5-9869-c1f4d316148f"
migrations_dir = "cloudflare/migrations"

# Branch previews use disposable test rooms, never production campaign data.
[[previews.d1_databases]]
binding = "DB"
database_id = "78919bd1-caab-4655-8765-064797b250ad"

# Guest entry only; established players' sync/commands are not throttled by this budget.
# Conservative per-network allowance supports groups sharing Wi-Fi. Edge-local, not a global quota.
[[ratelimits]]
name = "ROOM_ENTRY_LIMIT"
namespace_id = "2026100201"
simple = { limit = 60, period = 60 }

[vars]
ACCOUNT_ORIGIN = "https://lootsplit.oliverstorie2017.workers.dev"
# ACCOUNT_SECRET is a Worker secret, never committed. Guest play does not depend on it.
