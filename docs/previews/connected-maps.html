<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Lootsplit · Connected map preview</title>
<style>
:root{color-scheme:dark;font:15px/1.5 system-ui;--bg:#0c1924;--panel:#172b39;--ink:#eee9db;--gold:#cfb77d;--line:#466071}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg)}button,select,input{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;min-height:44px;padding:8px 12px}button{cursor:pointer}button:focus-visible{outline:3px solid #86bded}button:disabled{opacity:.45}h1,h2{font:normal 26px Georgia;margin:4px 0 12px}p{color:#bec8ce}small{color:var(--gold)}[hidden]{display:none!important}.screen{height:100dvh;position:relative;overflow:hidden}.terrain{position:absolute;inset:0;background:#394c40;touch-action:none}.terrain svg{width:100%;height:100%;transform-origin:center}.top{position:absolute;inset:max(12px,env(safe-area-inset-top)) 12px auto;display:flex;gap:8px;align-items:start;justify-content:space-between;pointer-events:none}.top>*{pointer-events:auto}.heading,.toolbar,.panel,.dock{background:#0c1924f5;border:1px solid var(--line);box-shadow:0 8px 35px #0005;border-radius:10px;padding:10px 12px}.heading h1{font-size:23px;margin:4px 0}.trail{display:flex;gap:5px;flex-wrap:wrap}.trail button{border:0;background:transparent;color:var(--gold);padding:4px 8px}.toolbar{display:flex;gap:6px}.panel{position:absolute;right:12px;top:120px;bottom:86px;width:390px;max-width:calc(100% - 24px);overflow:auto;overscroll-behavior:contain;padding:18px}.panel header{display:flex;align-items:center;justify-content:space-between;gap:8px}.panel label{display:block;margin:10px 0}.panel select,.panel input{width:100%}.panel .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.primary{background:var(--gold);color:#17232b;border-color:var(--gold)}.dock{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:6px;white-space:nowrap}.notice{position:absolute;bottom:82px;left:12px;max-width:calc(100% - 24px);background:#0c1924e8;padding:7px 12px;border-radius:6px;font-size:13px}.pin{cursor:pointer}.pin circle{fill:#18334c;stroke:#cfb77d;stroke-width:3}.pin text{fill:white;font:20px Georgia;text-anchor:middle;paint-order:stroke;stroke:#182623;stroke-width:3}.caption{position:absolute;left:12px;bottom:26px;font-size:11px;color:#cfb77d}@media(max-width:650px){.heading{max-width:66%;padding:7px}.heading h1{font-size:19px}.heading small{font-size:10px}.trail button{font-size:12px;min-height:36px}.toolbar{padding:4px;flex-direction:column}.toolbar button{font-size:12px;padding:6px}.panel{top:auto;bottom:0;left:0;right:0;width:100%;max-width:100%;max-height:65dvh;border-radius:16px 16px 0 0;padding-bottom:max(20px,env(safe-area-inset-bottom));z-index:3}.panel.expanded{max-height:85dvh}.caption{display:none}.dock{padding:5px;gap:3px}.dock button{padding:7px}.notice{bottom:78px}}@media(max-height:450px){.heading small{display:none}.panel{top:75px;bottom:12px;left:auto;width:360px;max-height:none}.notice{display:none}}
</style><main class="screen"><div class="terrain" id="terrain"><svg id="map" viewBox="0 0 1200 800" aria-label="Synthetic campaign map"><defs><pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#eee5be66"/></pattern></defs><g id="art"></g></svg></div><header class="top"><div class="heading"><small>LOOTSPLIT · INTERACTIVE FLOW PREVIEW</small><h1 id="title"></h1><nav class="trail" id="trail" aria-label="Map trail"></nav></div><div class="toolbar"><button id="places">Places</button><button id="full">Fullscreen</button></div></header><aside class="panel" id="panel" hidden></aside><div class="notice" id="notice" role="status">Browsing changes only your view. Party location: Brackenford.</div><nav class="dock" aria-label="Map controls"><button id="back">← Back</button><button id="out" aria-label="Zoom out">−</button><button id="fit">Fit map</button><button id="in" aria-label="Zoom in">+</button></nav><span class="caption">Synthetic campaign · no live transactions</span></main>
<script>
const $=id=>document.getElementById(id), names={region:'The Green March',town:'Brackenford',battle:'The Old Watchtower'};let scene='region',trail=[],camera={x:0,y:0,z:1},cameras={},party='Brackenford',active='The Green March',combat=false,commission=false;
const pin=(id,x,y,label,glyph)=>`<g class="pin" data-pin="${id}" transform="translate(${x} ${y})" role="button" tabindex="0" aria-label="${label}"><circle r="24"/><text y="7">${glyph}</text><text y="51">${label}</text></g>`;
const art={region:`<rect width="1200" height="800" fill="#3d5745"/><path d="M0 650Q230 480 420 530T740 390T1200 230" stroke="#71969b" stroke-width="80" fill="none"/><path d="M80 200L240 70 390 240 530 130 660 280" stroke="#82917a" stroke-width="60" fill="none"/><path d="M210 670L570 470 870 200" stroke="#d7bb85" stroke-width="9" fill="none" stroke-dasharray="12 9"/>${pin('town',570,470,'Brackenford','⌂')}${pin('battle',870,200,'Old Watchtower','⚑')}`,town:`<rect width="1200" height="800" fill="#78826b"/><path d="M100 800L120 0" stroke="#729ca6" stroke-width="160"/><path d="M190 450H1110M600 120V750" stroke="#d1bea0" stroke-width="65"/><g fill="#6f5140" stroke="#3b352e" stroke-width="8"><rect x="300" y="210" width="170" height="140"/><rect x="710" y="205" width="160" height="145"/><rect x="300" y="560" width="180" height="130"/><rect x="710" y="545" width="210" height="140"/></g>${pin('forge',385,280,'Ash & Anvil','⚒')}${pin('inn',790,275,'The Lantern Inn','⌂')}${pin('battle',920,450,'Road to the watchtower','⚑')}`,battle:`<rect width="1200" height="800" fill="#49513f"/><path d="M250 650V160H950V650H650V800H480V650Z" fill="#a9a18b" stroke="#343c37" stroke-width="25"/><path d="M580 160V380H950M250 450H480M720 450V650" stroke="#343c37" stroke-width="18"/><rect width="1200" height="800" fill="url(#grid)"/>${pin('hero',520,580,'Mira','M')}${pin('enemy',790,320,'Revealed scout','S')}`};
function paint(){$('map').style.transform=`translate(${camera.x}px,${camera.y}px) scale(${camera.z})`}
function draw(){$('art').innerHTML=art[scene];$('title').textContent=names[scene];$('trail').innerHTML=[...new Set([...trail,scene])].map(s=>`<button data-go="${s}" ${s===scene?'aria-current="page"':''}>${s==='region'?'Regional':s==='town'?'Local':'Battle'} · ${names[s]}</button>`).join('');$('back').disabled=!trail.length;paint();document.querySelectorAll('[data-pin]').forEach(e=>{e.onclick=()=>place(e.dataset.pin);e.onkeydown=k=>{if(k.key==='Enter'||k.key===' '){k.preventDefault();e.click()}}});document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));}
function go(next,back=false){if(next===scene)return;cameras[scene]={...camera};if(!back)trail.push(scene);scene=next;camera=cameras[next]||{x:0,y:0,z:1};close();draw()}
function close(){$('panel').hidden=true;$('panel').classList.remove('expanded')}
function panel(title,body){$('panel').hidden=false;$('panel').innerHTML=`<header><h2>${title}</h2><button id="closePanel">Close</button></header>${body}`;$('closePanel').onclick=close;}
function note(s){$('notice').textContent=s}
function place(id){if(id==='town'){go('town');note('Opened Brackenford. Party position and players’ active scene are unchanged.');return}if(id==='battle'){panel('Old Watchtower',`<p>Linked battle map · 5 ft per tile</p><div class="row"><button id="browse">Open map</button><button class="primary" id="encounter">Start encounter here</button></div>`);$('browse').onclick=()=>go('battle');$('encounter').onclick=review;return}if(id==='forge'){panel('Ash & Anvil',`<small>BLACKSMITH · OPEN · BRACKENFORD</small><p>The same shop, supplies and commissions available from Market.</p><label>Commission<select><option>Custom longsword</option><option>Reinforce a shield</option></select></label><label>Customer<select><option>Mira</option></select></label><p>Materials, payment and campaign days are reviewed before an order is accepted.</p><button class="primary" id="order">${commission?'View commission':'Review commission'}</button><div class="row"><button id="expand">Expand panel</button></div>`);$('expand').onclick=()=>$('panel').classList.toggle('expanded');$('order').onclick=()=>{commission=true;panel('Commission review',`<p>Synthetic demonstration: a custom longsword for Mira. An actual order uses the existing authoritative smith workflow.</p><p>Closing this panel returns to your map without moving the party or changing the camera.</p>`)};return}if(id==='inn'){panel('The Lantern Inn','<p>Ordinary services use the existing shop counter. Buying lodging does not automatically advance time or grant a rest.</p>');return}panel(combat?'Encounter · round 1':'Prepared battle scene',`<p>${combat?'Mira’s turn · only explicitly revealed combatants are shared.':'This map can be browsed independently of combat.'}</p><button class="primary" id="combatAction">${combat?'Conclude & review loot':'Start encounter here'}</button>`);$('combatAction').onclick=combat?conclude:review;}
function review(){panel('Start encounter here',`<label>Saved encounter<select><option>Watchtower patrol</option></select></label><label>Presentation<select id="mode"><option>Open linked battle map · 5 ft grid</option><option>Keep current view · theatre of the mind</option></select></label><p>Prepared enemies remain private until revealed. This does not move the party or advance campaign time.</p><label><input id="share" type="checkbox" checked style="width:auto"> Show scene to players</label><button class="primary" id="start">Start saved encounter</button>`);$('start').onclick=()=>{combat=true;const show=$('share').checked,mode=$('mode').selectedIndex;if(mode===0)go('battle');if(show)active=names[scene];note('Encounter started. Players’ active scene: '+active);place('hero')}}
function conclude(){combat=false;panel('Encounter concluded',`<p>Review recipients and loot in the existing tracker. Returning never awards loot a second time.</p><button class="primary" id="return">Return to exploration</button>`);$('return').onclick=()=>{go('town');note('Returned to Brackenford. Camera restored; combat history and tokens retained.')}}
$('places').onclick=()=>{panel('Places & scenes',`<p>Party: ${party}<br>Players’ active scene: ${active}</p><div class="row"><button id="region">Regional map</button><button id="town">Town map</button><button id="battle">Battle map</button></div><div class="row"><button id="activate">Show players</button><button id="move">Move party here</button></div>`);['region','town','battle'].forEach(s=>$(s).onclick=()=>go(s));$('activate').onclick=()=>{active=names[scene];note('Players’ active scene: '+active);close()};$('move').onclick=()=>{party=names[scene];note('Explicit party movement previewed: '+party);close()}};
$('back').onclick=()=>go(trail.pop(),true);$('in').onclick=()=>{camera.z=Math.min(5,camera.z*1.25);paint()};$('out').onclick=()=>{camera.z=Math.max(.5,camera.z/1.25);paint()};$('fit').onclick=()=>{camera={x:0,y:0,z:1};paint()};$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{note('The map fills the available browser window.')}};
let pointer;$('terrain').onpointerdown=e=>{if(e.target.closest('[data-pin]'))return;pointer={id:e.pointerId,x:e.clientX,y:e.clientY};$('terrain').setPointerCapture(e.pointerId)};$('terrain').onpointermove=e=>{if(pointer?.id!==e.pointerId)return;camera.x+=e.clientX-pointer.x;camera.y+=e.clientY-pointer.y;pointer={id:e.pointerId,x:e.clientX,y:e.clientY};paint()};$('terrain').onpointerup=()=>pointer=null;$('terrain').onwheel=e=>{e.preventDefault();camera.z=Math.max(.5,Math.min(5,camera.z*Math.exp(-e.deltaY*.002)));paint()};document.onkeydown=e=>{if(e.key==='Escape')close()};draw();
</script></html>
