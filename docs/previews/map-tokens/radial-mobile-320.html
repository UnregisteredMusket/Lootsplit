<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Map radial menu</title><style>
:root{
  --color-bg:#0c1424;--color-elevated:#18243c;--color-subtle:#1c2c4c;--color-border:#3a4d72;
  --color-lead:#c8a96b;--color-fg:#f6f1e6;--color-muted:#cbbfae;--color-faint:#8e8798;
  --color-accent:#e0a04a;--color-danger:#9a3044;--color-positive:#7d9a6a;--color-negative:#c46a62;
  --font-display:"Cormorant Garamond","Source Serif 4",Palatino,"Palatino Linotype",serif;
  --font-sans:"Source Sans 3","Avenir Next","Segoe UI",system-ui,sans-serif;
  --map-panel:color-mix(in srgb,var(--color-elevated) 92%,transparent);
  --map-edge:color-mix(in srgb,var(--color-fg) 16%,transparent);
  --map-shadow:0 3px 15px #0003;
  --select:#4d8fe0;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--color-bg);color:var(--color-fg);font-family:var(--font-sans);font-size:14px}
.page{padding:24px 0 32px}
.caption{max-width:1232px;margin:0 auto 10px;padding:0 24px;display:flex;gap:12px;align-items:baseline}
.caption h1{font-family:var(--font-display);font-weight:600;font-size:26px;margin:0;color:var(--color-lead)}
.caption p{margin:0;color:var(--color-muted);font-size:13px}
.frame{position:relative;width:1280px;height:800px;overflow:hidden;margin:0 auto 28px;border-top:1px solid var(--map-edge);border-bottom:1px solid var(--map-edge)}
.frame.short{height:720px}
.map{position:absolute;inset:0}
.glass{background:var(--map-panel);color:var(--color-fg);border:1px solid var(--map-edge);border-radius:18px;box-shadow:var(--map-shadow);backdrop-filter:blur(14px)}
.capsule{position:absolute;top:14px;left:14px;display:flex;align-items:center;height:46px;border-radius:16px;z-index:5}
.capsule .back{width:44px;height:44px;display:grid;place-items:center;border-right:1px solid var(--map-edge)}
.capsule .title{font-family:var(--font-display);font-size:21px;font-weight:600;padding:0 14px 0 12px;display:flex;align-items:center;gap:8px}
.capsule .title small{font-family:var(--font-sans);font-size:12px;color:var(--color-muted);font-weight:400}
.rail{position:absolute;display:flex;flex-direction:column;gap:2px;padding:4px;border-radius:22px;z-index:5}
.rail.right{right:14px;top:84px}
.rail.left{left:14px;top:84px}
.tool{width:44px;height:44px;display:grid;place-items:center;border-radius:13px;color:var(--color-fg);position:relative}
.tool.on{background:color-mix(in srgb,var(--color-accent) 26%,transparent);color:#ffd99a}
.tool .badge{position:absolute;top:3px;right:3px;min-width:16px;height:16px;border-radius:8px;background:var(--color-accent);color:#1a1422;font:700 10px/16px var(--font-sans);text-align:center;padding:0 4px}
.cap{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--color-faint);text-align:center;padding:6px 0 2px}
.sep{height:1px;background:var(--map-edge);margin:4px 6px}
.zoom{position:absolute;right:14px;bottom:16px;display:flex;border-radius:16px;z-index:5}
.zoom span{width:44px;height:40px;display:grid;place-items:center;color:var(--color-fg)}
.zoom span+span{border-left:1px solid var(--map-edge)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:16px;height:16px}
.token{position:absolute;border-radius:50%;display:grid;place-items:center;font:700 15px var(--font-sans);color:var(--color-fg);
  background:radial-gradient(circle at 35% 30%,#3b4d72,#18243c 70%);border:2px solid var(--color-lead);box-shadow:0 2px 6px #000a;z-index:3}
.token.enemy{background:radial-gradient(circle at 35% 30%,#7a3340,#3a1620 70%);border-color:#e08a7a}
.token.ally{background:radial-gradient(circle at 35% 30%,#3e5e3a,#1b2c19 70%);border-color:#a9c48f}
.token.mine{border-color:#ffd99a;box-shadow:0 0 0 3px color-mix(in srgb,var(--color-accent) 45%,transparent),0 2px 6px #000a}
.token.sel{box-shadow:0 0 0 3px var(--select),0 0 14px color-mix(in srgb,var(--select) 70%,transparent)}
.token.ghost{opacity:.55;border-style:dashed;box-shadow:none}
.token.hidden{opacity:.55}
.token.dim{filter:saturate(.4) brightness(.8)}
.token .lbl{position:absolute;top:100%;margin-top:3px;left:50%;transform:translateX(-50%);white-space:nowrap;font:600 11.5px var(--font-sans);
  background:color-mix(in srgb,var(--color-bg) 78%,transparent);padding:1px 7px;border-radius:8px;color:var(--color-fg)}
.token .lbl.top{top:auto;bottom:100%;margin:0 0 3px}
.token .tag{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--color-elevated);border:1px solid var(--map-edge);display:grid;place-items:center}
.foot{position:absolute;border:2px solid color-mix(in srgb,var(--color-lead) 80%,transparent);background:color-mix(in srgb,var(--color-lead) 14%,transparent);border-radius:6px;z-index:2}
.foot.target{border-color:#9fd28a;background:color-mix(in srgb,#9fd28a 22%,transparent)}
.foot.bad{border-color:#e08a7a;background:color-mix(in srgb,#e08a7a 20%,transparent)}
.menu{position:absolute;z-index:20;min-width:268px;padding:6px;border-radius:14px;background:color-mix(in srgb,var(--color-elevated) 96%,transparent);
  border:1px solid var(--map-edge);box-shadow:0 10px 34px #000a;backdrop-filter:blur(16px)}
.menu .hd{display:flex;justify-content:space-between;align-items:center;padding:6px 10px 8px;border-bottom:1px solid var(--map-edge);margin-bottom:4px}
.menu .hd b{font-family:var(--font-display);font-size:17px;font-weight:600}
.menu .hd span{font-size:11.5px;color:var(--color-muted)}
.menu .grp{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--color-faint);padding:7px 10px 3px}
.mi{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:9px;color:var(--color-fg);font-size:13.5px}
.mi svg{color:var(--color-lead)}
.mi kbd{margin-left:auto;font:600 10.5px var(--font-sans);color:var(--color-muted);border:1px solid var(--map-edge);border-radius:5px;padding:1px 5px}
.mi .arr{margin-left:auto;color:var(--color-muted)}
.mi.focus{background:color-mix(in srgb,var(--color-accent) 22%,transparent);outline:2px solid color-mix(in srgb,var(--color-accent) 70%,transparent);outline-offset:-2px}
.mi.danger{color:#f0a49a}.mi.danger svg{color:#f0a49a}
.mi.dis{color:var(--color-faint)}.mi.dis svg{color:var(--color-faint)}
.mi small{color:var(--color-muted);font-size:11.5px;margin-left:auto}
.msep{height:1px;background:var(--map-edge);margin:4px 6px}
.note{position:absolute;z-index:6;max-width:300px;padding:10px 12px;border-radius:12px;font-size:12.5px;line-height:1.4;color:var(--color-fg);
  background:color-mix(in srgb,#0c1424 88%,transparent);border:1px dashed color-mix(in srgb,var(--color-accent) 70%,transparent)}
.note b{color:#ffd99a}
.pointer{position:absolute;z-index:21;width:22px;height:22px}
.toast{position:absolute;z-index:12;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;border-radius:14px;font-size:13.5px}
.toast button,.btn{font:600 13px var(--font-sans);color:#1a1422;background:var(--color-accent);border:0;border-radius:10px;padding:8px 12px}
.btn.ghost{background:transparent;color:var(--color-fg);border:1px solid var(--map-edge)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;font-size:12.5px;border:1px solid var(--map-edge);background:var(--map-panel)}
.chip.on{background:color-mix(in srgb,var(--color-accent) 24%,transparent);border-color:color-mix(in srgb,var(--color-accent) 60%,transparent);color:#ffe0aa}
.hud{position:absolute;z-index:6;top:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:8px 16px;border-radius:16px}
.hud .r{font-family:var(--font-display);font-size:19px;font-weight:600;color:var(--color-lead)}

  body{background:#070c16}
  .wrap{display:flex;flex-direction:column;align-items:center;gap:22px;padding:18px 0}
  .ph{margin:0;width:320px}
  .ph figcaption{font-size:12.5px;color:var(--color-muted);padding:0 12px 8px;line-height:1.4}
  .phone{position:relative;width:320px;height:844px;overflow:hidden;border-radius:28px;border:1px solid var(--map-edge);background:var(--color-bg)}
  .pcap{position:absolute;z-index:5;left:12px;right:12px;top:12px;height:46px;display:flex;align-items:center;gap:6px;border-radius:16px;font-family:var(--font-display);font-size:19px}
  .pcap .back{width:44px;height:44px;display:grid;place-items:center;border-right:1px solid var(--map-edge)}
  .psetup{position:absolute;z-index:5;left:12px;right:12px;top:66px;display:flex;overflow:hidden;border-radius:16px;padding:2px}
  .psetup .tool{flex:none}
  .pdock{position:absolute;z-index:5;left:12px;right:12px;bottom:16px;display:flex;overflow:hidden;border-radius:18px;padding:3px}
  .pdock .tool{flex:none}.pdock .scroll{display:flex;flex:1;min-width:0;overflow:hidden}
  .wheel{position:absolute;inset:0;z-index:8;overflow:visible}
  .wheel path{fill:color-mix(in srgb,var(--color-elevated) 95%,transparent);stroke:var(--map-edge);stroke-width:1}
  .wheel path.hot{fill:color-mix(in srgb,var(--color-accent) 40%,var(--color-elevated));stroke:var(--color-accent);stroke-width:2}
  .wheel .ring{fill:#0c142466}
  .wheel .hub{fill:var(--color-bg);stroke:var(--map-edge)}
  .sl{position:absolute;z-index:9;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;width:64px;text-align:center;color:var(--color-fg)}
  .sl svg{color:var(--color-lead)}
  .sl.hot svg{color:#ffe0aa}
  .sl small{font-size:10px;line-height:1.1;font-weight:600}
  .hubt{position:absolute;z-index:9;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:1px;width:80px;text-align:center}
  .hubt small{font-size:10px;color:var(--color-muted)}
  .finger{position:absolute;z-index:10;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:#ffffff40;border:2px solid #ffffffb0;box-shadow:0 0 0 6px #ffffff18}
  .pill{position:absolute;z-index:10;left:50%;transform:translateX(-50%);padding:8px 14px;border-radius:14px;font-size:13px;white-space:nowrap}
  .sheet{position:absolute;z-index:12;left:0;right:0;bottom:0;max-height:76%;overflow:hidden;border-radius:22px 22px 0 0;padding:6px 14px 20px}
  .grab{width:44px;height:5px;border-radius:3px;background:var(--map-edge);margin:4px auto 8px}
  .sh{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 6px;border-bottom:1px solid var(--map-edge)}
  .sh b{font-family:var(--font-display);font-size:20px}.sh span{font-size:12px;color:var(--color-muted)}
  .sheet .grp{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--color-faint);padding:9px 4px 3px}
